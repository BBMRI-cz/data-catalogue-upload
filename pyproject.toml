[project]
name = "data-catalogue-upload"
version = "0.1.0"
description = "BBMRI data catalogue monorepo: the uploader sync job and the source API services (uv workspace)."
readme = "README.md"
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/*"]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "types-requests",
    "lxml-stubs",
    "httpx",
]

[tool.ruff.lint.per-file-ignores]
# load_dotenv must run before importing the app (db session builds the engine at import)
"apps/uploader/migrations/env.py" = ["E402"]
"apps/uploader/src/uploader/main.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
no_implicit_optional = true
check_untyped_defs = true
