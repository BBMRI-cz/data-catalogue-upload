name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore DataCatalogueUpload.slnx
      - name: Format check
        run: dotnet format DataCatalogueUpload.slnx --verify-no-changes --no-restore
      - name: Build (warnings as errors)
        run: dotnet build DataCatalogueUpload.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test DataCatalogueUpload.slnx --configuration Release --no-build
