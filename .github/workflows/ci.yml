name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  # Fail fast if the single workspace lockfile drifts from the pyproject files.
  lock-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install uv
      - run: uv lock --check

  # One job per workspace member; each lints/type-checks/tests only its own package.
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [uploader, biobank_api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install workspace (shared dev tooling lives at the root)
        run: uv sync --all-packages --group dev
      - name: Lint (ruff)
        run: |
          uv run ruff check apps/${{ matrix.package }}
          uv run ruff format --check apps/${{ matrix.package }}
      - name: Type check (mypy)
        run: uv run mypy apps/${{ matrix.package }}
      - name: Tests (pytest)
        run: uv run pytest apps/${{ matrix.package }}/tests
