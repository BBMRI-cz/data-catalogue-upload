services:
  # --- uploader: its own PostgreSQL (the host-run sync job connects via localhost:5432) ---
  uploader-db:
    image: postgres:16
    container_name: uploader-db
    restart: unless-stopped
    env_file:
      - apps/uploader/.env
    ports:
      - "5432:5432"
    volumes:
      - uploader_db_data:/var/lib/postgresql/data

  # --- biobank_api: its own PostgreSQL + server + (profiled) ingestion ---
  biobank-db:
    image: postgres:16
    container_name: biobank-db
    restart: unless-stopped
    env_file:
      - apps/biobank_api/.env
    ports:
      - "5433:5432"
    volumes:
      - biobank_db_data:/var/lib/postgresql/data

  biobank_api:
    build:
      context: .
      dockerfile: apps/biobank_api/Dockerfile
    container_name: biobank-api
    restart: unless-stopped
    env_file:
      - apps/biobank_api/.env
    environment:
      # Reach the biobank-db container; creds come from the env_file above.
      POSTGRES_HOST: biobank-db
      POSTGRES_PORT: 5432
      BIOBANK_HOST: 0.0.0.0
      BIOBANK_PORT: 8001
    depends_on:
      - biobank-db
    ports:
      - "8001:8001"

  # Ingestion (one-shot). Run on demand / on a schedule:
  #   docker compose -f compose.prod.yml --profile ingest run --rm biobank_api_ingest
  biobank_api_ingest:
    build:
      context: .
      dockerfile: apps/biobank_api/Dockerfile
    profiles:
      - ingest
    env_file:
      - apps/biobank_api/.env
    environment:
      POSTGRES_HOST: biobank-db
      POSTGRES_PORT: 5432
      BIOBANK_XML_EXPORT_PATH: /data/exports
    depends_on:
      - biobank-db
    command: ["biobank-api-ingest"]
    volumes:
      - ./data/exports:/data/exports:ro

volumes:
  uploader_db_data:
  biobank_db_data:
