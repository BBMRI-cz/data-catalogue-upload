services:
  # --- uploader: its own PostgreSQL (the host-run sync job connects via localhost:5432) ---
  uploader-db:
    image: postgres:16
    container_name: uploader-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: data_catalogue_upload
    ports:
      - "5432:5432"
    volumes:
      - uploader_db_data:/var/lib/postgresql/data

  # --- biobank_api: its own PostgreSQL + server + (profiled) ingestion ---
  biobank-db:
    image: postgres:16
    container_name: biobank-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: biobank_api
    ports:
      - "5433:5432"
    volumes:
      - biobank_db_data:/var/lib/postgresql/data

  biobank-api:
    build:
      context: .
      dockerfile: src/BiobankApi/BiobankApi.Web/Dockerfile
    container_name: biobank-api
    restart: unless-stopped
    environment:
      POSTGRES_HOST: biobank-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: biobank_api
      ASPNETCORE_URLS: http://+:8001
      RUN_MIGRATIONS: "true"
    depends_on:
      - biobank-db
    ports:
      - "8001:8001"

  # Ingestion (one-shot). Run on demand / on a schedule:
  #   docker compose -f compose.prod.yml --profile ingest run --rm biobank-api-ingest
  biobank-api-ingest:
    build:
      context: .
      dockerfile: src/BiobankApi/BiobankApi.Web/Dockerfile
    profiles:
      - ingest
    environment:
      POSTGRES_HOST: biobank-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: biobank_api
      BIOBANK_XML_EXPORT_PATH: /data/exports
      RUN_MIGRATIONS: "true"
    depends_on:
      - biobank-db
    command: ["ingest"]
    volumes:
      - ./data/exports:/data/exports:ro

volumes:
  uploader_db_data:
  biobank_db_data:
