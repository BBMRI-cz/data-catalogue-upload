services:
  # --- uploader: its own PostgreSQL (the host-run sync job connects via localhost:5432) ---
  uploader-db:
    image: postgres:16
    container_name: uploader-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: data_catalogue_upload
    ports:
      - "5432:5432"
    volumes:
      - uploader_db_data:/var/lib/postgresql/data

  # --- biobank_api: its own PostgreSQL + server + (profiled) ingestion ---
  biobank-db:
    image: postgres:16
    container_name: biobank-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: biobank_api
    ports:
      - "5433:5432"
    volumes:
      - biobank_db_data:/var/lib/postgresql/data

  biobank-api:
    build:
      context: .
      dockerfile: src/BiobankApi/BiobankApi.Web/Dockerfile
    container_name: biobank-api
    restart: unless-stopped
    environment:
      POSTGRES_HOST: biobank-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: biobank_api
      ASPNETCORE_URLS: http://+:8001
      RUN_MIGRATIONS: "true"
      # Patient XML the parser ingests (weekly Quartz job + POST /admin/ingest).
      BIOBANK_XML_EXPORT_PATH: /data/exports
    depends_on:
      - biobank-db
    ports:
      - "8001:8001"
    volumes:
      - /home/mou/patient_data:/data/exports:ro

  # --- sequencing_api: its own PostgreSQL + server + (profiled) ingestion ---
  sequencing-db:
    image: postgres:16
    container_name: sequencing-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sequencing_api
    ports:
      - "5434:5432"
    volumes:
      - sequencing_db_data:/var/lib/postgresql/data

  sequencing-api:
    build:
      context: .
      dockerfile: src/SequencingApi/SequencingApi.Web/Dockerfile
    container_name: sequencing-api
    restart: unless-stopped
    environment:
      POSTGRES_HOST: sequencing-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sequencing_api
      ASPNETCORE_URLS: http://+:8002
      RUN_MIGRATIONS: "true"
      # The organised run tree, the libraries table, and the pseudonymizer's mappings. All read-only:
      # this service only ever reads them (weekly Quartz job + POST /admin/ingest).
      SEQUENCING_DATA_PATH: /data/organised-runs
      SEQUENCING_LIBRARIES_PATH: /data/libraries
      SEQUENCING_MAPPING_TABLE_PATH: /data/mapping-table
    depends_on:
      - sequencing-db
    ports:
      - "8002:8002"
    volumes:
      - /muni-sc/OrganisedRuns:/data/organised-runs:ro
      - /muni-sc/Libraries:/data/libraries:ro
      - /muni-sc/mapping_table:/data/mapping-table:ro

volumes:
  uploader_db_data:
  biobank_db_data:
  sequencing_db_data:
