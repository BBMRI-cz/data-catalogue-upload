[project]
name = "uploader"
version = "0.1.0"
description = "Scheduled sync job: aggregate per-patient source data and upsert it into the data catalogue."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "sqlalchemy",
    "psycopg2-binary",
    "python-dotenv>=1.2.2",
    "alembic>=1.18.4",
]

[project.scripts]
uploader = "uploader.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uploader"]
