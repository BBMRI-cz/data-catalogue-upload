[project]
name = "biobank_api"
version = "0.1.0"
description = "Biobank API: parse biobank XML exports and serve patient/sample/clinical data to the uploader."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy",
    "psycopg2-binary",
    "alembic>=1.18.4",
    "lxml",
    "python-dotenv>=1.2.2",
]

[project.scripts]
biobank-api-serve = "biobank_api.server:main"
biobank-api-ingest = "biobank_api.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biobank_api"]
